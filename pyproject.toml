[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serviscraft"
version = "0.8.0"
description = "Gestor grafico de servidores de Minecraft sobre Podman rootless"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Propietaria (ver LICENSE)" }
authors = [{ name = "Jonathan Hurtado", email = "JonathanHurtadoDev@proton.me" }]
keywords = ["minecraft", "server", "podman", "kde", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment :: Simulation",
  "Topic :: System :: Systems Administration",
]
# PySide6 es la unica dependencia de Python. Podman es una dependencia del sistema:
# compruebala con `serviscraft --self-test`.
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-qt>=4.2"]

[project.gui-scripts]
serviscraft = "serviscraft.app:main"

[project.urls]
Homepage = "https://github.com/JonathanDevHurtado/serviscraft"
"Registro de errores" = "https://github.com/JonathanDevHurtado/serviscraft/issues"

[tool.setuptools]
packages = ["serviscraft", "serviscraft.core", "serviscraft.ui"]
include-package-data = true

[tool.setuptools.package-data]
serviscraft = ["resources/icons/*.svg", "resources/*.desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "gui: pruebas que necesitan PySide6 y una plataforma Qt sin pantalla",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["N802"] # closeEvent y otros metodos de Qt usan camelCase
